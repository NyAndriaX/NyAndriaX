<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a191d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a2930;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- Simple image/document icon -->
  <g transform="translate(400, 300)" opacity="0.5">
    <!-- Document/Image frame -->
    <rect x="-100" y="-80" width="200" height="160" 
          fill="none" 
          stroke="#4a90e2" 
          stroke-width="4" 
          rx="8"
          stroke-linecap="round"
          stroke-linejoin="round"/>
    
    <!-- Corner fold effect -->
    <path d="M 60 -80 L 100 -80 L 100 -40 L 60 -40 Z" 
          fill="#1a191d" 
          stroke="#4a90e2" 
          stroke-width="4"
          stroke-linejoin="round"/>
    
    <!-- Image placeholder lines -->
    <line x1="-60" y1="-20" x2="40" y2="-20" 
          stroke="#4a90e2" 
          stroke-width="3" 
          stroke-linecap="round" 
          opacity="0.6"/>
    <line x1="-60" y1="0" x2="40" y2="0" 
          stroke="#4a90e2" 
          stroke-width="3" 
          stroke-linecap="round" 
          opacity="0.6"/>
    <line x1="-60" y1="20" x2="40" y2="20" 
          stroke="#4a90e2" 
          stroke-width="3" 
          stroke-linecap="round" 
          opacity="0.6"/>
    
    <!-- Small icon in corner -->
    <circle cx="-70" cy="-60" r="12" 
            fill="none" 
            stroke="#4a90e2" 
            stroke-width="2.5" 
            opacity="0.7"/>
    <path d="M -75 -55 L -70 -50 L -65 -55" 
          fill="none" 
          stroke="#4a90e2" 
          stroke-width="2.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          opacity="0.7"/>
  </g>
</svg>
